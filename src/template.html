<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Onboarding Desk</title>
<meta name="description" content="Vendor onboarding: submit a vendor, watch the checks run, get an approved, pending or rejected decision with reasons.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2386A5FF'/%3E%3Cpath d='M9 16.5l5 5 9-10' fill='none' stroke='%230D121A' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: one page. A steps strip, then a fixed-height workspace (scrolling form on the left,
   live run and result on the right), then the case history. Dark navy surfaces,
   blue for action and selection, green / orange / red only for outcomes. Dark theme by choice. */
:root {
  --bg: #0D121A; --surface: #151C27; --surface-2: #1A2230; --ink: #E8ECF3; --ink-2: #AAB4C6; --ink-3: #7C889C;
  --line: #263042; --line-2: #1E2736; --accent: #86A5FF; --accent-hover: #A3BBFF; --accent-edge: #86A5FF; --accent-ink: #0D121A;
  --accent-soft: #1C2849; --accent-text: #A9C0FF;
  --ok: #5FD093; --ok-bg: #12301F; --warn: #F0B34F; --warn-bg: #33270F; --bad: #FF8E8B; --bad-bg: #3B1818;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3);
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--ink-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 16px; padding: 0 24px; height: 56px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; white-space: nowrap; }
.brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; }
.spacer { flex: 1; }
.linkbtn { background: none; border: 0; padding: 6px 10px; color: var(--ink-3); font-size: 13px; border-radius: 6px; }
.linkbtn:hover { color: var(--ink); background: var(--accent-soft); }

/* ---------- page ---------- */
.app { max-width: 1480px; margin: 0 auto; padding: 20px 24px 40px; display: grid; gap: 16px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.step { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.step .n { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.step b { display: block; font-weight: 600; }
.step span { color: var(--ink-3); font-size: 13px; }
.workspace { display: grid; grid-template-columns: minmax(360px, 480px) minmax(0, 1fr); gap: 16px; height: clamp(580px, calc(100vh - 196px), 900px); }
.panel { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line-2); }
.panel-h h2 { font-size: 16px; }
.panel-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 18px; scrollbar-width: thin; scrollbar-color: var(--accent-edge) transparent; }
.panel-f { padding: 12px 18px; border-top: 1px solid var(--line-2); background: var(--surface); display: grid; gap: 8px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 18px 0; }
.hint { padding: 6px 18px 10px; color: var(--ink-3); font-size: 12.5px; border-bottom: 1px solid var(--line-2); }
.hint.err { color: var(--bad); }
@media (max-width: 1000px) {
  .steps { grid-template-columns: 1fr; }
  .workspace { grid-template-columns: 1fr; height: auto; }
  .panel.form-panel, .panel.run-panel { height: 80vh; min-height: 520px; }
  .app { padding: 16px; } .topbar { padding: 0 16px; }
}

/* ---------- buttons, inputs ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn:hover { background: var(--accent-soft); border-color: var(--accent-edge); }
.btn.primary { background: var(--accent); border-color: var(--accent-edge); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.wide { width: 100%; padding: 12px 14px; font-size: 15px; }
.btn.sm { padding: 5px 11px; font-size: 13px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.select, .fld input, .fld select { padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13.5px; }
.select { padding: 5px 9px; font-size: 13px; max-width: 100%; }
.fld input, .fld select { width: 100%; background: var(--surface-2); }
.fld input:focus, .fld select:focus { outline: 2px solid var(--accent-edge); outline-offset: 0; background: var(--surface); }
.fld input::placeholder { color: #5A667C; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 11px; font-size: 12.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.warn { background: var(--warn-bg); color: var(--warn); } .pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.neutral { background: var(--accent-soft); color: var(--accent-text); }
.chip { display: inline-block; padding: 1px 7px; border-radius: 5px; background: var(--accent-soft); font-family: var(--mono); font-size: 11.5px; color: var(--accent-text); }
.tag { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; margin-left: 6px; }
.ic { width: 16px; height: 16px; flex: none; }
.ic.ok { color: var(--ok); } .ic.warn { color: var(--warn); } .ic.bad { color: var(--bad); } .ic.skip { color: var(--ink-3); } .ic.info { color: var(--accent-text); }
.banner-info { display: flex; gap: 8px; align-items: center; padding: 6px 10px; border-radius: 8px; background: var(--accent-soft); font-size: 13px; }
.banner-info[hidden] { display: none; }

/* ---------- form ---------- */
.fh { font-size: 11px; text-transform: uppercase; letter-spacing: .09em; color: var(--accent-text); margin: 18px 0 8px; font-weight: 700; }
.fh:first-child { margin-top: 0; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld { display: grid; gap: 3px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld > span { font-size: 12px; color: var(--ink-3); }
.form-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
.docrow { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.docrow-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.editor { width: 100%; min-height: 220px; resize: vertical; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: 12.5px/1.55 var(--mono); tab-size: 2; }
.editor-status { margin-top: 6px; font-size: 12px; }
@media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }

/* ---------- collapsible sections ---------- */
.fold { border-top: 1px solid var(--line-2); }
.fold > summary { cursor: pointer; padding: 13px 20px; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before { content: ''; width: 6px; height: 6px; border-right: 2px solid var(--accent-edge); border-bottom: 2px solid var(--accent-edge); transform: rotate(-45deg); transition: transform .15s; }
.fold[open] > summary::before { transform: rotate(45deg); }
.fold-body { padding: 0 20px 18px; }
.fold.plain { border: 0; margin-top: 18px; }
.fold.plain > summary { padding: 6px 0; color: var(--ink-2); font-weight: 500; }
.fold.plain .fold-body { padding: 8px 0 0; }

/* ---------- live run ---------- */
.stages { display: grid; padding: 4px 0 8px; }
.stage-head { display: flex; align-items: center; gap: 12px; padding: 10px 10px; border-radius: 10px; cursor: pointer; }
.stage-head:hover { background: var(--accent-soft); }
.stage-dot { width: 26px; height: 26px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12.5px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.stage-name { flex: 1; font-weight: 500; }
.stage-count { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.stage[data-state="idle"] .stage-name { color: var(--ink-3); }
.stage[data-state="running"] .stage-dot { background: var(--accent-soft); border-color: var(--accent-edge); color: var(--accent-text); position: relative; }
.stage[data-state="running"] .stage-dot::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--accent-edge); animation: spin .8s linear infinite; }
.stage[data-state="ok"] .stage-dot { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.stage[data-state="note"] .stage-dot { background: var(--accent-soft); color: var(--accent-text); border-color: transparent; }
.stage[data-state="action"] .stage-dot { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.stage[data-state="block"] .stage-dot { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
@keyframes spin { to { transform: rotate(360deg); } }
.stage-checks { display: none; margin: 0 0 6px 48px; padding-left: 14px; border-left: 2px solid var(--line); }
.stage.open .stage-checks { display: grid; gap: 2px; }
.ck { display: grid; grid-template-columns: 16px 1fr; gap: 8px; align-items: start; padding: 4px 0; font-size: 13px; animation: slide .22s ease-out; }
.ck .ic { margin-top: 2px; }
.ck-t { color: var(--ink); }
.ck.pass .ck-t, .ck.skip .ck-t, .ck.info .ck-t { color: var(--ink-2); }
.ck-d { color: var(--ink-3); font-size: 12.5px; }
.ck.fail, .ck.warn { padding: 8px 10px; border-radius: 8px; margin: 3px 0; }
.ck.fail { background: var(--bad-bg); } .ck.warn { background: var(--accent-soft); }
.ck.fail .ck-t, .ck.warn .ck-t { font-weight: 600; }
@keyframes slide { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .ck { animation: none; } .stage[data-state="running"] .stage-dot::after { animation-duration: 2s; } }

/* ---------- result ---------- */
.result { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; margin-bottom: 14px; background: var(--surface); }
.result[hidden] { display: none; }
.verdict { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: start; padding: 16px 18px; }
.verdict.ok { background: var(--ok-bg); } .verdict.warn { background: var(--warn-bg); } .verdict.bad { background: var(--bad-bg); }
.verdict .big { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.verdict.ok .big { color: var(--ok); } .verdict.warn .big { color: var(--warn); } .verdict.bad .big { color: var(--bad); }
.verdict .sub { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; font-weight: 700; opacity: .85; }
.verdict .headline { margin-top: 4px; color: var(--ink); }
.verdict .meta { display: grid; gap: 2px; text-align: right; font-size: 12.5px; color: var(--ink-2); }
@media (max-width: 640px) { .verdict { grid-template-columns: 1fr; } .verdict .meta { text-align: left; } }
.diff { padding: 10px 18px; background: var(--accent-soft); font-size: 13px; border-top: 1px solid var(--line); }
.sect { padding: 14px 18px; border-top: 1px solid var(--line-2); }
.alerts { display: grid; gap: 12px; padding: 14px 18px; border-top: 1px solid var(--line-2); }
.alert { border: 1px solid; border-left-width: 6px; border-radius: 10px; padding: 12px 14px 8px; }
.alert-h { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; margin: 0 0 6px; }
.alert.fix { border-color: var(--warn); background: var(--warn-bg); } .alert.fix .alert-h { color: var(--warn); }
.alert.review, .alert.block { border-color: var(--bad); background: var(--bad-bg); } .alert.review .alert-h, .alert.block .alert-h { color: var(--bad); }
.alert.note { border-color: var(--accent-edge); background: var(--accent-soft); } .alert.note .alert-h { color: var(--accent-text); }
.flags { display: grid; }
.flag { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; }
.alert .flag + .flag { border-top: 1px solid rgba(0,0,0,.08); }
.kindpill { flex: none; min-width: 84px; text-align: center; font: 700 11.5px/1 var(--mono); letter-spacing: .05em; padding: 5px 8px; border-radius: 5px; color: #0D121A; background: var(--ink-2); }
.flag.fix .kindpill { background: var(--warn); } .flag.review .kindpill, .flag.block .kindpill { background: var(--bad); } .flag.note .kindpill { background: var(--accent); color: var(--accent-ink); }
.flag-text { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.flag.note .flag-text { font-weight: 500; }
.ck .flags { margin-top: 4px; } .ck .flag { padding: 3px 0; font-size: 12.5px; }
.ck .kindpill { min-width: 74px; font-size: 10.5px; padding: 4px 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.mail { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
.mail-h { display: grid; gap: 2px; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 13px; }
.mail-h .k { color: var(--ink-3); display: inline-block; width: 58px; }
.mail pre { margin: 0; padding: 14px; font: 13px/1.6 var(--sans); white-space: pre-wrap; overflow-wrap: anywhere; }
.mail-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; color: var(--ink-3); }
.plist { display: grid; gap: 2px; }
.audit { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.audit td { padding: 4px 8px 4px 0; vertical-align: top; border-bottom: 1px solid var(--line-2); }
.audit td:first-child { color: var(--ink-3); white-space: nowrap; font-family: var(--mono); }
.audit td:nth-child(2) { color: var(--ink-2); white-space: nowrap; }

/* ---------- cases ---------- */
.cases-h { flex-wrap: wrap; }
.counts { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; }
.filters button { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; color: var(--ink-2); }
.filters button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent-edge); color: var(--accent-ink); font-weight: 600; }
.twrap { overflow: auto; max-height: 340px; }
table.cases { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 720px; }
table.cases th { position: sticky; top: 0; text-align: left; padding: 8px 14px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--line); background: var(--surface-2); }
table.cases td { padding: 10px 14px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.cases tbody tr { cursor: pointer; }
table.cases tbody tr:hover { background: var(--accent-soft); }
.cell-main { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.empty { padding: 28px; text-align: center; color: var(--ink-3); }

/* ---------- drawer ---------- */
.scrim { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); z-index: 41; background: var(--bg); box-shadow: -10px 0 40px rgba(40,32,0,.25); overflow-y: auto; }
.drawer-h { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.drawer-b { padding: 16px 20px 40px; }

/* ---------- how it works ---------- */
.how > summary { cursor: pointer; padding: 14px 18px; font-weight: 600; font-size: 16px; list-style: none; display: flex; align-items: center; gap: 8px; }
.how > summary::-webkit-details-marker { display: none; }
.how > summary::before { content: ''; width: 7px; height: 7px; border-right: 2px solid var(--accent-edge); border-bottom: 2px solid var(--accent-edge); transform: rotate(-45deg); transition: transform .15s; }
.how[open] > summary::before { transform: rotate(45deg); }
.how-body { padding: 4px 18px 18px; display: grid; gap: 16px; }
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.flow .st { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); }
.flow .no { flex: none; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 600; }
.decision-rows { display: grid; gap: 8px; }
.decision-rows div { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: center; }
.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
.mini td { padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-2); }
.onfail { font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.onfail.reject { background: var(--bad-bg); color: var(--bad); }
.onfail.pending-vendor, .onfail.pending-internal { background: var(--warn-bg); color: var(--warn); }
.onfail.note { background: var(--accent-soft); color: var(--accent-text); }
.prose { max-width: 75ch; color: var(--ink-2); }
.prose ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.cols2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 900px) { .cols2 { grid-template-columns: 1fr; } }

/* ---------- polish: depth, gradients, progress ---------- */
:root { --accent-2: #B79CFF; --grad: linear-gradient(135deg, #86A5FF 0%, #B79CFF 100%); }
body { background:
  radial-gradient(900px 480px at 8% -8%, rgba(134,165,255,.18), transparent 60%),
  radial-gradient(800px 460px at 100% 0%, rgba(183,156,255,.14), transparent 60%),
  radial-gradient(700px 500px at 50% 110%, rgba(95,208,147,.07), transparent 60%),
  var(--bg); background-attachment: fixed; }
.topbar { background: rgba(21,28,39,.78); backdrop-filter: blur(10px); }
.brand-mark { background: var(--grad); box-shadow: 0 4px 14px rgba(134,165,255,.35); }
.brand span { background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 15px; letter-spacing: .01em; }
.panel { position: relative; background: linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0) 120px), var(--surface); border-color: #2A3548; }
.panel::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 3px; background: var(--grad); opacity: .9; }
.run-panel::before { background: linear-gradient(90deg, #5FD093, #86A5FF); }
.cases-panel::before { background: linear-gradient(90deg, #B79CFF, #F0B34F); }
.panel-h h2 { display: flex; align-items: center; gap: 10px; }
.panel-h h2 .hico { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.run-panel .hico { background: var(--ok-bg); color: var(--ok); }
.cases-panel .hico { background: #2A2145; color: var(--accent-2); }
.btn.primary { background: var(--grad); border-color: transparent; box-shadow: 0 6px 18px rgba(134,165,255,.28); transition: transform .12s, box-shadow .12s; }
.btn.primary:hover { background: var(--grad); filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 10px 24px rgba(134,165,255,.38); }
.btn.primary[disabled] { box-shadow: none; transform: none; }
.seg button[aria-pressed="true"], .filters button[aria-pressed="true"] { background: var(--grad); border-color: transparent; }
.fh { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.fh::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--grad); }
.fh::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.fld input:focus, .fld select:focus { outline: 2px solid var(--accent); box-shadow: 0 0 0 4px rgba(134,165,255,.15); }

/* stage progress bar */
.progress { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 0 0 14px; }
.progress i { height: 6px; border-radius: 99px; background: var(--line); transition: background .3s, box-shadow .3s; }
.progress i.running { background: var(--accent); box-shadow: 0 0 10px rgba(134,165,255,.7); animation: pulse 1s ease-in-out infinite; }
.progress i.ok { background: var(--ok); } .progress i.note { background: #D9C25A; } .progress i.action { background: var(--warn); } .progress i.block { background: var(--bad); }
@keyframes pulse { 50% { opacity: .5; } }
.stage-head { border: 1px solid transparent; }
.stage[data-state="running"] .stage-head { background: var(--accent-soft); border-color: rgba(134,165,255,.35); }
.stage[data-state="running"] .stage-name { color: var(--ink); }
.empty-run { display: grid; justify-items: center; gap: 6px; text-align: center; padding: 8px 12px 18px; color: var(--ink-3); }
.empty-run[hidden] { display: none; }
.empty-run .big-ic { width: 56px; height: 56px; border-radius: 16px; display: grid; place-items: center; background: var(--grad); color: var(--accent-ink); box-shadow: 0 10px 30px rgba(134,165,255,.3); margin-bottom: 4px; }
.empty-run b { color: var(--ink); font-size: 15px; }

/* verdict */
.verdict { grid-template-columns: auto 1fr auto; align-items: center; position: relative; overflow: hidden; }
.verdict::after { content: ''; position: absolute; inset: 0; background: radial-gradient(420px 160px at 0% 0%, rgba(255,255,255,.08), transparent 70%); pointer-events: none; }
.vicon { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; font-weight: 700; color: #0D121A; background: currentColor; position: relative; z-index: 1; }
.vicon span { color: #0D121A; line-height: 1; }
.verdict.ok .vicon { color: var(--ok); box-shadow: 0 0 28px rgba(95,208,147,.4); } .verdict.warn .vicon { color: var(--warn); box-shadow: 0 0 28px rgba(240,179,79,.4); } .verdict.bad .vicon { color: var(--bad); box-shadow: 0 0 28px rgba(255,142,139,.4); }
.verdict > div { position: relative; z-index: 1; }
@media (max-width: 640px) { .verdict { grid-template-columns: auto 1fr; } .verdict .meta { grid-column: 1 / -1; } }

/* cases */
.avatar { width: 30px; height: 30px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; color: #0D121A; margin-right: 10px; vertical-align: middle; flex: none; }
.pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.neutral::before { display: none; }
.counts .pill { font-size: 12.5px; padding: 3px 11px; }
table.cases tbody tr:hover { background: var(--accent-soft); box-shadow: inset 3px 0 0 var(--accent); }
</style>
</head>
