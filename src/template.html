<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vendor Onboarding Desk</title>
<meta name="description" content="Vendor onboarding process: submit a vendor, watch it run, get an approved, pending or rejected decision with reasons.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23101A2B'/%3E%3Cpath d='M9 16.5l5 5 9-10' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: a calm operations desk. Fixed top bar, then either a two-column Process view
   (submission on the left, live run and result on the right) or full-width dashboard/map pages. */
:root {
  --bg: #F1F3F6; --surface: #FFFFFF; --surface-2: #F6F8FA; --ink: #101A2B; --ink-2: #46526A; --ink-3: #74809A;
  --line: #DCE1EA; --line-2: #E9EDF3; --accent: #2750C8; --accent-ink: #FFFFFF; --accent-soft: #E6ECFB;
  --ok: #17794C; --ok-bg: #E3F3EA; --warn: #8F5A00; --warn-bg: #FCF0D9; --bad: #B02A2A; --bad-bg: #FBE6E5;
  --shadow: 0 1px 2px rgba(16,26,43,.06), 0 6px 20px rgba(16,26,43,.05);
  --sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D121A; --surface: #151C27; --surface-2: #1A2230; --ink: #E8ECF3; --ink-2: #AAB4C6; --ink-3: #7C889C;
    --line: #263042; --line-2: #1E2736; --accent: #86A5FF; --accent-ink: #0D121A; --accent-soft: #1C2849;
    --ok: #5FD093; --ok-bg: #12301F; --warn: #F0B34F; --warn-bg: #33270F; --bad: #FF8E8B; --bad-bg: #3B1818;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D121A; --surface: #151C27; --surface-2: #1A2230; --ink: #E8ECF3; --ink-2: #AAB4C6; --ink-3: #7C889C;
  --line: #263042; --line-2: #1E2736; --accent: #86A5FF; --accent-ink: #0D121A; --accent-soft: #1C2849;
  --ok: #5FD093; --ok-bg: #12301F; --warn: #F0B34F; --warn-bg: #33270F; --bad: #FF8E8B; --bad-bg: #3B1818;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 6px 20px rgba(0,0,0,.3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.mono { font-family: var(--mono); font-size: 12.5px; }
.muted { color: var(--ink-3); }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 24px; padding: 0 24px; height: 56px; background: var(--surface); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; }
.brand-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: var(--surface); display: grid; place-items: center; }
.nav { display: flex; gap: 4px; height: 100%; }
.nav button { background: none; border: 0; padding: 0 14px; height: 100%; color: var(--ink-2); font-weight: 500; border-bottom: 2px solid transparent; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.nav .count { margin-left: 6px; padding: 1px 7px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); font-size: 11.5px; color: var(--ink-2); }
.spacer { flex: 1; }
.linkbtn { background: none; border: 0; padding: 6px 8px; color: var(--ink-3); font-size: 12.5px; border-radius: 6px; }
.linkbtn:hover { color: var(--ink); background: var(--surface-2); }

/* ---------- shared pieces ---------- */
main { padding: 24px; max-width: 1440px; margin: 0 auto; }
.view[hidden] { display: none; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 16px 18px 0; }
.card-h h2 { font-size: 15px; }
.card-b { padding: 14px 18px 18px; }
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; }
.pill.ok { background: var(--ok-bg); color: var(--ok); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.pill.neutral { background: var(--surface-2); color: var(--ink-2); border-color: var(--line); }
.chip { display: inline-block; padding: 1px 7px; border-radius: 5px; background: var(--surface-2); border: 1px solid var(--line); font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); font-weight: 500; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.06); }
.btn[disabled] { opacity: .55; cursor: not-allowed; }
.btn.sm { padding: 4px 10px; font-size: 12.5px; }
.ic { width: 16px; height: 16px; flex: none; }
.ic.ok { color: var(--ok); } .ic.warn { color: var(--warn); } .ic.bad { color: var(--bad); } .ic.skip { color: var(--ink-3); } .ic.info { color: var(--accent); }

/* ---------- process view ---------- */
.process { display: grid; grid-template-columns: minmax(340px, 430px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1000px) { .process { grid-template-columns: 1fr; } main { padding: 16px; } .topbar { padding: 0 16px; gap: 12px; } .brand span { display: none; } }
.scn-list { display: grid; gap: 6px; margin-bottom: 12px; }
.scn { display: flex; align-items: center; gap: 10px; text-align: left; padding: 9px 11px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); width: 100%; }
.scn:hover { background: var(--surface-2); }
.scn[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.scn .kind { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; color: var(--ink-3); width: 44px; flex: none; }
.scn[aria-checked="true"] .kind { color: var(--accent); }
.scn .lab { font-weight: 500; flex: 1; }
.scn .mod { font-size: 11px; color: var(--warn); }
.blurb { padding: 10px 12px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0; color: var(--ink-2); margin-bottom: 14px; }
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
.tabs button { background: none; border: 0; padding: 7px 12px; color: var(--ink-3); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.summary { display: grid; grid-template-columns: 112px 1fr; gap: 6px 12px; margin: 0; font-size: 13px; }
.summary dt { color: var(--ink-3); } .summary dd { margin: 0; overflow-wrap: anywhere; }
.summary .sec { grid-column: 1 / -1; margin-top: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
.docs { display: grid; gap: 4px; }
.doc { display: flex; justify-content: space-between; gap: 8px; padding: 5px 8px; border: 1px solid var(--line-2); border-radius: 6px; background: var(--surface-2); font-size: 12.5px; }
.editor { width: 100%; min-height: 300px; resize: vertical; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: 12.5px/1.55 var(--mono); tab-size: 2; }
.editor-status { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; }
.tweaks { margin-top: 14px; }
.tweaks h4 { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); margin-bottom: 6px; }
.tweak-row { display: flex; flex-wrap: wrap; gap: 6px; }
.tweak-row button { padding: 4px 10px; border-radius: 999px; border: 1px dashed var(--line); background: none; font-size: 12.5px; color: var(--ink-2); }
.tweak-row button:hover { border-style: solid; color: var(--ink); background: var(--surface-2); }
.runbar { display: grid; gap: 10px; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.runbar .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { background: none; border: 0; padding: 4px 11px; font-size: 12.5px; color: var(--ink-2); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; color: var(--ink-2); }
.check input { margin-top: 3px; }
.banner-info[hidden] { display: none; }
.banner-info { display: flex; gap: 10px; align-items: center; padding: 8px 12px; border-radius: 8px; background: var(--accent-soft); color: var(--ink); font-size: 13px; margin-bottom: 12px; }

/* run panel */
.rightcol { display: grid; gap: 16px; min-width: 0; }
.runhead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 18px; }
.runhead h2 { font-size: 15px; }
.stages { display: grid; gap: 0; padding: 4px 8px 10px; }
.stage { border-radius: 8px; }
.stage-head { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.stage-head:hover { background: var(--surface-2); }
.stage-dot { width: 24px; height: 24px; flex: none; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 600; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink-3); font-variant-numeric: tabular-nums; }
.stage-title { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.stage-title strong { font-weight: 500; }
.stage-title span { font-size: 12.5px; }
.stage-count { font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }
.stage[data-state="idle"] .stage-title strong { color: var(--ink-3); }
.stage[data-state="running"] .stage-dot { border-color: var(--accent); color: var(--accent); position: relative; }
.stage[data-state="running"] .stage-dot::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--accent); animation: spin .8s linear infinite; }
.stage[data-state="ok"] .stage-dot { background: var(--ok-bg); color: var(--ok); border-color: transparent; }
.stage[data-state="note"] .stage-dot { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.stage[data-state="action"] .stage-dot { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.stage[data-state="block"] .stage-dot { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
@keyframes spin { to { transform: rotate(360deg); } }
.stage-checks { display: none; margin: 0 0 6px 46px; padding-left: 14px; border-left: 2px solid var(--line-2); }
.stage.open .stage-checks { display: grid; gap: 2px; }
.ck { display: grid; grid-template-columns: 16px 30px 1fr; gap: 8px; align-items: start; padding: 4px 0; font-size: 13px; animation: slide .22s ease-out; }
.ck .ic { margin-top: 2px; }
.ck .rid { font-family: var(--mono); font-size: 12px; color: var(--ink-3); padding-top: 1px; }
.ck .msg { color: var(--ink-2); overflow-wrap: anywhere; }
.ck.fail .msg, .ck.warn .msg { color: var(--ink); }
@keyframes slide { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .ck { animation: none; } .stage[data-state="running"] .stage-dot::after { animation-duration: 2s; } }

/* result */
.result[hidden] { display: none; }
.verdict { display: grid; grid-template-columns: auto 1fr auto; gap: 18px; align-items: center; padding: 18px 20px; border-radius: 12px 12px 0 0; border-bottom: 1px solid var(--line); }
.verdict.ok { background: var(--ok-bg); } .verdict.warn { background: var(--warn-bg); } .verdict.bad { background: var(--bad-bg); }
.verdict .big { font-size: 26px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; }
.verdict.ok .big { color: var(--ok); } .verdict.warn .big { color: var(--warn); } .verdict.bad .big { color: var(--bad); }
.verdict .sub { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; opacity: .85; }
.verdict .headline { color: var(--ink); max-width: 62ch; }
.risk { text-align: right; min-width: 120px; }
.risk .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-2); }
.risk .val { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.meter { height: 6px; border-radius: 3px; background: rgba(0,0,0,.12); overflow: hidden; margin-top: 4px; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--ink); }
@media (max-width: 640px) { .verdict { grid-template-columns: 1fr; } .risk { text-align: left; } }
.facts { display: flex; flex-wrap: wrap; gap: 8px 18px; padding: 12px 20px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--ink-2); }
.facts b { color: var(--ink); font-weight: 500; }
.sect { padding: 16px 20px; border-bottom: 1px solid var(--line); }
.sect:last-child { border-bottom: 0; }
.sect h3 { font-size: 13px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
.sect h3 .n { font-weight: 400; color: var(--ink-3); }
.finding { display: grid; grid-template-columns: 4px 1fr; gap: 12px; margin-bottom: 10px; }
.finding .bar { border-radius: 2px; background: var(--line); }
.finding.blocker .bar { background: var(--bad); } .finding.major .bar { background: var(--warn); } .finding.minor .bar { background: var(--accent); }
.finding .top { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 2px; }
.finding .ttl { font-weight: 500; }
.finding .m { color: var(--ink-2); overflow-wrap: anywhere; }
.finding ul { margin: 6px 0 0; padding-left: 18px; color: var(--ink-3); font-size: 12.5px; }
.say { margin-top: 6px; padding: 7px 10px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line-2); font-size: 12.5px; color: var(--ink-2); }
.say b { color: var(--ink); font-weight: 500; }
details.passed summary { cursor: pointer; color: var(--ink-2); padding: 4px 0; }
details.passed .plist { display: grid; gap: 2px; margin-top: 6px; }
.mail { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
.mail-h { display: grid; gap: 2px; padding: 10px 14px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 13px; }
.mail-h .k { color: var(--ink-3); display: inline-block; width: 58px; }
.mail pre { margin: 0; padding: 14px; font: 13px/1.6 var(--sans); white-space: pre-wrap; overflow-wrap: anywhere; }
.mail-f { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 14px; border-top: 1px solid var(--line); background: var(--surface-2); font-size: 12.5px; color: var(--ink-3); }
.audit { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.audit td { padding: 4px 8px 4px 0; vertical-align: top; border-bottom: 1px solid var(--line-2); }
.audit td:first-child { color: var(--ink-3); white-space: nowrap; font-family: var(--mono); }
.audit td:nth-child(2) { color: var(--ink-2); white-space: nowrap; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.diff { padding: 12px 20px; background: var(--accent-soft); border-bottom: 1px solid var(--line); font-size: 13px; }
.idle-note { padding: 4px 18px 16px; color: var(--ink-3); font-size: 13px; }

/* ---------- dashboard ---------- */
.page-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
.page-h h1 { font-size: 22px; }
.page-h p { color: var(--ink-3); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
.kpi { padding: 14px 16px; }
.kpi .l { color: var(--ink-3); font-size: 12.5px; }
.kpi .v { font-size: 28px; font-weight: 600; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; line-height: 1.2; }
.kpi .s { font-size: 12.5px; color: var(--ink-3); }
.kpi.ok .v { color: var(--ok); } .kpi.warn .v { color: var(--warn); } .kpi.bad .v { color: var(--bad); }
.dash-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; }
@media (max-width: 900px) { .dash-grid { grid-template-columns: 1fr; } }
.stack { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--line-2); margin: 6px 0 12px; }
.stack i { display: block; height: 100%; }
.legend { display: grid; gap: 6px; }
.legend div { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.legend .sw { width: 10px; height: 10px; border-radius: 3px; }
.legend .v { margin-left: auto; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.reasons { display: grid; gap: 9px; }
.reason { display: grid; grid-template-columns: 34px 1fr 28px; gap: 10px; align-items: center; font-size: 13px; }
.reason .bar { height: 8px; background: var(--line-2); border-radius: 4px; overflow: hidden; margin-top: 3px; }
.reason .bar i { display: block; height: 100%; background: var(--warn); border-radius: 4px; }
.reason .t { color: var(--ink-2); }
.filters { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 18px 12px; }
.filters button { padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: none; font-size: 12.5px; color: var(--ink-2); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.twrap { overflow-x: auto; }
table.cases { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 760px; }
table.cases th { text-align: left; padding: 8px 12px; font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; border-bottom: 1px solid var(--line); background: var(--surface-2); }
table.cases td { padding: 10px 12px; border-bottom: 1px solid var(--line-2); vertical-align: middle; }
table.cases tbody tr { cursor: pointer; }
table.cases tbody tr:hover { background: var(--surface-2); }
table.cases tbody tr:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.cell-main { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.tag { font-size: 11px; color: var(--ink-3); border: 1px solid var(--line); padding: 0 5px; border-radius: 4px; margin-left: 6px; }
.empty { padding: 28px; text-align: center; color: var(--ink-3); }
.mini { width: 100%; border-collapse: collapse; font-size: 13px; }
.mini th, .mini td { text-align: left; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--line-2); vertical-align: top; }
.mini th { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); font-weight: 600; }

/* drawer */
.scrim { position: fixed; inset: 0; background: rgba(8,12,20,.45); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100%); z-index: 41; background: var(--bg); box-shadow: -10px 0 40px rgba(0,0,0,.25); overflow-y: auto; }
.drawer-h { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
.drawer-b { padding: 16px 20px 40px; }
.drawer .card.result { box-shadow: none; }

/* ---------- process map ---------- */
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; counter-reset: s; margin-bottom: 16px; }
.flow .st { position: relative; padding: 12px 12px 12px 12px; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; }
.flow .st b { display: block; font-weight: 500; margin: 2px 0 2px; }
.flow .st span { font-size: 12.5px; color: var(--ink-3); }
.flow .st .no { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.map-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 16px; margin-bottom: 16px; align-items: start; }
@media (max-width: 1000px) { .map-grid { grid-template-columns: 1fr; } }
.onfail { font-size: 12px; font-weight: 500; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.onfail.reject { background: var(--bad-bg); color: var(--bad); }
.onfail.pending-vendor, .onfail.pending-internal { background: var(--warn-bg); color: var(--warn); }
.onfail.note { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.prose { max-width: 70ch; color: var(--ink-2); display: grid; gap: 8px; }
.prose ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; }
.decision-rows { display: grid; gap: 8px; }
.decision-rows div { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }

/* ---------- simplified layout (overrides) ---------- */
.btn.wide { width: 100%; padding: 11px 14px; margin-top: 4px; }
.card-h h2 { font-size: 16px; }
.scn { align-items: flex-start; }
.scn .kind { width: 40px; padding-top: 2px; }
.scn .kind.happy { color: var(--ok); } .scn .kind.edge { color: var(--warn); } .scn .kind.bonus { color: var(--bad); }
.scn[aria-checked="true"] .kind { color: var(--accent); }
.scn .lab { display: flex; flex-direction: column; gap: 1px; }
.scn .sub { font-weight: 400; font-size: 12.5px; color: var(--ink-2); }
.row-between { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.fold { border-top: 1px solid var(--line); }
.fold > summary { cursor: pointer; padding: 13px 20px; font-weight: 500; list-style: none; display: flex; align-items: center; gap: 8px; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary::before { content: ''; width: 6px; height: 6px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg); transition: transform .15s; }
.fold[open] > summary::before { transform: rotate(45deg); }
.fold-body { padding: 0 20px 18px; }
.fold.plain { border: 0; margin-top: 12px; }
.fold.plain > summary { padding: 6px 0; color: var(--ink-2); font-weight: 400; }
.fold.plain .fold-body { padding: 8px 0 0; }
.fold-body .editor { min-height: 240px; }
.folds { border-top: 0; }
.stage-name { flex: 1; font-weight: 500; }
.stage[data-state="idle"] .stage-name { color: var(--ink-3); }
.stage-head { padding: 10px 10px; }
.stage-checks { margin-left: 46px; }
.ck { grid-template-columns: 16px 1fr; }
.ck-t { color: var(--ink); }
.ck.pass .ck-t, .ck.skip .ck-t, .ck.info .ck-t { color: var(--ink-2); }
.ck-d { color: var(--ink-3); font-size: 12.5px; }
.verdict { grid-template-columns: 1fr auto; align-items: start; }
.verdict .meta { display: grid; gap: 2px; text-align: right; font-size: 12.5px; color: var(--ink-2); }
.verdict .headline { margin-top: 4px; }
@media (max-width: 640px) { .verdict { grid-template-columns: 1fr; } .verdict .meta { text-align: left; } }
.issues { display: grid; gap: 12px; }
.issue { display: grid; grid-template-columns: 112px 1fr; gap: 12px; align-items: start; }
.tagline { justify-self: start; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 500; white-space: nowrap; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.issue.block .tagline { background: var(--bad-bg); color: var(--bad); border-color: transparent; }
.issue.review .tagline, .issue.fix .tagline { background: var(--warn-bg); color: var(--warn); border-color: transparent; }
.issue-t { font-weight: 500; }
.issue-d { color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
@media (max-width: 520px) { .issue { grid-template-columns: 1fr; gap: 4px; } }
.card > .filters { padding: 14px 18px 12px; }
.kpi { padding: 16px 18px; }
.kpi .v { font-size: 30px; }
.cell-main { max-width: 300px; }
.flow .st { display: flex; gap: 10px; align-items: center; }
.flow .st b { margin: 0; }
.decision-rows div { grid-template-columns: 96px 1fr; align-items: center; }

/* ---------- stand-out alerts ---------- */
.alerts { display: grid; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.alert { border: 1px solid; border-left-width: 6px; border-radius: 10px; padding: 12px 14px 8px; }
.alert-h { font-size: 12px; text-transform: uppercase; letter-spacing: .09em; font-weight: 700; margin: 0 0 6px; }
.alert.fix { border-color: var(--warn); background: var(--warn-bg); } .alert.fix .alert-h { color: var(--warn); }
.alert.review { border-color: var(--bad); background: var(--bad-bg); } .alert.review .alert-h { color: var(--bad); }
.alert.block { border-color: var(--bad); background: var(--bad-bg); } .alert.block .alert-h { color: var(--bad); }
.alert.note { border-color: var(--accent); background: var(--accent-soft); } .alert.note .alert-h { color: var(--accent); }
.flags { display: grid; }
.flag { display: flex; gap: 10px; align-items: baseline; padding: 7px 0; }
.alert .flag + .flag { border-top: 1px solid color-mix(in srgb, currentColor 0%, var(--line)); }
.kindpill { flex: none; min-width: 84px; text-align: center; font: 700 11.5px/1 var(--mono); letter-spacing: .05em; padding: 5px 8px; border-radius: 5px; color: var(--surface); background: var(--ink-2); }
.flag.fix .kindpill { background: var(--warn); } .flag.review .kindpill, .flag.block .kindpill { background: var(--bad); } .flag.note .kindpill { background: var(--accent); color: var(--accent-ink); }
.flag-text { font-weight: 600; color: var(--ink); overflow-wrap: anywhere; }
.flag.note .flag-text { font-weight: 500; }
.ck.fail, .ck.warn { padding: 8px 10px; border-radius: 8px; margin: 3px 0; }
.ck.fail { background: var(--bad-bg); } .ck.warn { background: var(--accent-soft); }
.ck.fail .ck-t, .ck.warn .ck-t { font-weight: 600; }
.ck .flags { margin-top: 4px; }
.ck .flag { padding: 3px 0; font-size: 12.5px; }
.ck .kindpill { min-width: 74px; font-size: 10.5px; padding: 4px 6px; }
.plist .ck.fail .ck-d, .plist .ck.warn .ck-d { color: var(--ink-2); }

/* ---------- form ---------- */
.modeseg { display: flex; margin-bottom: 14px; }
.modeseg button { flex: 1; padding: 7px 12px; }
.form-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 4px; }
.fh { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); margin: 16px 0 8px; font-weight: 600; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fld { display: grid; gap: 3px; min-width: 0; }
.fld.wide { grid-column: 1 / -1; }
.fld > span { font-size: 12px; color: var(--ink-3); }
.fld input, .fld select, .form-tools select { width: 100%; padding: 7px 9px; border-radius: 7px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); font: inherit; font-size: 13.5px; }
.form-tools select { width: auto; }
.fld input:focus, .fld select:focus { outline: 2px solid var(--accent); outline-offset: 0; background: var(--surface); }
.docrow { margin-top: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--surface); }
.docrow-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.form-err { color: var(--bad); margin-bottom: 8px; }
@media (max-width: 520px) { .form-grid { grid-template-columns: 1fr; } }
#run-btn { position: sticky; bottom: 12px; z-index: 3; box-shadow: 0 6px 18px rgba(16,26,43,.22); }
</style>
</head>
